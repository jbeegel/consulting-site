<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spread Hunter</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#15181d; --muted:#5e6672; --line:#e3e6ea;
    --good:#0f7a4d; --goodbg:#e7f6ee; --warn:#8a5a00; --warnbg:#fdf3e0;
    --bad:#a32b2b; --badbg:#fbeaea; --accent:#1f4fd8; --chip:#eef1f5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111317; --card:#191c22; --ink:#e9ecf1; --muted:#9aa3b0; --line:#2b3039;
      --good:#5bd39b; --goodbg:#12301f; --warn:#e0ae4e; --warnbg:#332713;
      --bad:#ef8a8a; --badbg:#3a1c1c; --accent:#7ea2ff; --chip:#21262e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111317; --card:#191c22; --ink:#e9ecf1; --muted:#9aa3b0; --line:#2b3039;
    --good:#5bd39b; --goodbg:#12301f; --warn:#e0ae4e; --warnbg:#332713;
    --bad:#ef8a8a; --badbg:#3a1c1c; --accent:#7ea2ff; --chip:#21262e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  header{position:sticky;top:0;background:var(--bg);padding:16px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:21px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  button,select,input{font:inherit;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  button{cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .banner{margin:12px 0;padding:11px 13px;border-radius:9px;font-size:14px;
    background:var(--warnbg);color:var(--warn);border:1px solid rgba(138,90,0,.25)}
  .banner.err{background:var(--badbg);color:var(--bad);border-color:rgba(163,43,43,.25)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px;margin:14px 0}
  .top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
  .lot{font-weight:600;font-size:17px;line-height:1.35}
  .lot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
  .where{color:var(--muted);font-size:13px;margin-top:3px}
  .score{text-align:center;flex:0 0 auto;min-width:74px}
  .score b{display:block;font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums}
  .score span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
  .p-good{background:var(--goodbg);color:var(--good)}
  .p-warn{background:var(--warnbg);color:var(--warn)}
  .p-bad{background:var(--badbg);color:var(--bad)}
  .p-flat{background:var(--chip);color:var(--muted)}
  .why{margin:12px 0 0;padding:11px 13px;background:var(--chip);border-radius:9px;font-size:14px}
  h3{margin:18px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .rows{display:grid;gap:6px}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;
    padding:5px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted)}
  .row .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .row.tot{font-weight:650;border-top:1px solid var(--line);border-bottom:0;padding-top:8px;margin-top:2px}
  .comp{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;
    border-bottom:1px dashed var(--line)}
  .comp:last-child{border-bottom:0}
  .comp .t{min-width:0}
  .comp .t a{color:var(--accent);text-decoration:none}
  .comp .t a:hover{text-decoration:underline}
  .comp .meta{color:var(--muted);font-size:12px}
  .comp .pr{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.speed{width:100%;border-collapse:collapse;font-size:14px}
  table.speed th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);padding:0 0 6px}
  table.speed td{padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.speed td:not(:first-child),table.speed th:not(:first-child){text-align:right}
  .bidbox{display:flex;gap:8px;align-items:center;margin:10px 0 2px;flex-wrap:wrap}
  .bidbox input{width:110px;font-variant-numeric:tabular-nums}
  .items{margin:0;padding-left:19px;font-size:14px}
  .items li{margin:3px 0}
  .star{font-weight:650}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .foot{color:var(--muted);font-size:12px;margin:26px 0 40px;text-align:center}
  .foot a{color:var(--muted)}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px}
  @media (max-width:560px){
    .wrap{padding:12px}
    .top{flex-direction:column-reverse;align-items:stretch}
    .score{text-align:left;display:flex;gap:9px;align-items:baseline}
    .score b{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Spread Hunter</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="bar">
    <button class="primary" id="load">Refresh</button>
    <select id="sort">
      <option value="score">Best score first</option>
      <option value="profit">Biggest profit first</option>
      <option value="fast">Fastest to sell first</option>
      <option value="ending">Ending soonest first</option>
    </select>
    <select id="hours">
      <option value="">Any end time</option>
      <option value="6">Ends within 6h</option>
      <option value="24" selected>Ends within 24h</option>
      <option value="72">Ends within 3 days</option>
    </select>
    <button id="demo">Show sample</button>
  </div>
</header>

<div id="msg"></div>
<div id="list"></div>

<div class="foot">
  Every dollar figure below is computed, not quoted —
  <a href="/spread/index.html">advanced dashboard</a>
</div>

</div>

<script>
"use strict";

// ---------------------------------------------------------------- helpers
var KEY = "spreadKey";
var money = function (n) {
  if (n === null || n === undefined || !isFinite(n)) return "—";
  var neg = n < 0, v = Math.abs(n);
  var s = v >= 100 ? Math.round(v).toLocaleString()
                   : v.toFixed(2).replace(/\.00$/, "");
  return (neg ? "−$" : "$") + s;
};
var pct = function (n) {
  return (n === null || n === undefined || !isFinite(n)) ? "—" : Math.round(n * 100) + "%";
};
var days = function (n) {
  if (n === null || n === undefined || !isFinite(n)) return "—";
  return n < 1 ? "<1 day" : Math.round(n) + (Math.round(n) === 1 ? " day" : " days");
};
var esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};
var countdown = function (sec) {
  if (sec === null || sec === undefined || !isFinite(sec)) return "no end time";
  if (sec <= 0) return "ended";
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h >= 48) return Math.floor(h / 24) + " days left";
  if (h >= 1) return h + "h " + m + "m left";
  return m + "m left";
};
var host = function (u) {
  try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return "link"; }
};
// Where a comp came from, in words a person recognises.
var platform = function (c) {
  var s = (c.source || "").toLowerCase();
  if (s.indexOf("ebay") >= 0) return "eBay";
  if (s.indexOf("heritage") >= 0) return "Heritage";
  if (s.indexOf("worthpoint") >= 0) return "WorthPoint";
  if (s.indexOf("hibid") >= 0) return "HiBid";
  if (s.indexOf("liveauction") >= 0) return "LiveAuctioneers";
  if (c.source) return c.source;
  return c.url ? host(c.url) : "unknown source";
};

// ---------------------------------------------------------------- state
var STATE = { rows: [], demo: false, cfg: null };

function headers() {
  var k = localStorage.getItem(KEY);
  return k ? { "x-spread-key": k } : {};
}

function note(html, isErr) {
  document.getElementById("msg").innerHTML = html
    ? '<div class="banner' + (isErr ? " err" : "") + '">' + html + "</div>" : "";
}

// ---------------------------------------------------------------- the math
// Landed cost: what leaves your pocket to own the thing.
function landed(bid, cfg) {
  var prem = bid * (cfg.buyerPremium || 0);
  var tax = (bid + prem) * (cfg.salesTax || 0);
  var pickup = cfg.pickupCost || 0;
  return {
    bid: bid, premium: prem, tax: tax, pickup: pickup,
    total: bid + prem + tax + pickup
  };
}

// A price point already carries its own fee math from the server; we only re-base
// the profit when the user tries a different bid.
function atBid(point, bid, cfg) {
  var L = landed(bid, cfg);
  var profit = point.net - L.total;
  return {
    price: point.price, net: point.net, profit: profit,
    roi: L.total > 0 ? profit / L.total : null,
    expected_days: point.expected_days
  };
}

// ---------------------------------------------------------------- render
var LABEL = { quick: "Sell fast", market: "Sell at market", patient: "Wait for the right buyer" };

function heatPill(h) {
  var cls = h === "hot" ? "p-good" : h === "warm" ? "p-warn"
          : h === "unvalued" ? "p-flat" : "p-flat";
  return '<span class="pill ' + cls + '">' + esc(h) + "</span>";
}

function gradePill(g) {
  var cls = (g === "A" || g === "B") ? "p-good" : g === "C" ? "p-warn" : "p-bad";
  return '<span class="pill ' + cls + '">Sells ' + esc(g) + "</span>";
}

function card(o, idx) {
  var lot = o.lot || {}, v = o.valuation, s = o.score || {}, cfg = STATE.cfg;
  var h = [];

  // --- what it is, and what we think of it
  var title = lot.url
    ? '<a href="' + esc(lot.url) + '" target="_blank" rel="noopener">' + esc(lot.title) + "</a>"
    : esc(lot.title);
  h.push('<div class="top">');
  h.push('<div><div class="lot">' + title + "</div>");
  h.push('<div class="where">' + esc(lot.auction_name || "auction") + " · " +
         countdown(s.seconds_left) + " · current bid <b>" + money(lot.high_bid || lot.min_bid || 0) +
         "</b></div></div>");
  h.push('<div class="score"><b>' + (s.valued ? s.score : "—") + "</b><span>score " +
         heatPill(s.heat || "unvalued") + "</span></div>");
  h.push("</div>");

  if (o.why) h.push('<div class="why">' + esc(o.why) + "</div>");

  if (!v) {
    h.push('<div class="why">Not appraised yet — no value estimate, so no profit figure. ' +
           "This lot is listed because the title looks worth a closer look.</div>");
    return '<div class="card">' + h.join("") + "</div>";
  }

  // --- what's inside it
  h.push("<h3>What's in it</h3>");
  var its = (v.items || []).filter(function (x) { return x && (x.name || x.item); });
  if (its.length) {
    h.push('<ul class="items">');
    its.forEach(function (it) {
      var nm = it.name || it.item;
      var star = v.standout_item && nm === v.standout_item;
      h.push("<li" + (star ? ' class="star"' : "") + ">" + esc(nm) +
             (it.value_mid != null ? " — worth about " + money(it.value_mid) : "") +
             (star ? " ← the one that matters" : "") + "</li>");
    });
    h.push("</ul>");
  } else {
    h.push('<div style="font-size:14px">' + esc(v.identified_item || "Contents not itemised") +
           (v.unit_count > 1 ? " (" + v.unit_count + " units)" : "") + "</div>");
  }

  // --- what it's worth, and the receipts
  h.push("<h3>What it resells for</h3>");
  h.push('<div class="rows">');
  h.push('<div class="row"><span class="k">Our estimate</span><span class="v">' +
         money(v.mid) + " <span class=\"k\">(range " + money(v.low) + "–" + money(v.high) +
         ")</span></span></div>");
  h.push('<div class="row"><span class="k">How sure we are</span><span class="v">' +
         pct(v.confidence) + " · " + esc(v.method || "") + "</span></div>");
  if (v.best_channel)
    h.push('<div class="row"><span class="k">Best place to sell</span><span class="v">' +
           esc(v.best_channel) + "</span></div>");
  h.push("</div>");

  var comps = (v.comps || []).filter(function (c) { return c && c.price; });
  if (comps.length) {
    h.push("<h3>Actual past sales this is based on</h3>");
    comps.slice(0, 6).forEach(function (c) {
      var t = c.url
        ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.title || "sold listing") + "</a>"
        : esc(c.title || "sold listing");
      h.push('<div class="comp"><div class="t">' + t +
             '<div class="meta">' + esc(platform(c)) +
             (c.date ? " · " + esc(c.date) : "") +
             (c.note ? " · " + esc(c.note) : "") +
             '</div></div><div class="pr">' + money(c.price) + "</div></div>");
    });
  } else {
    h.push("<h3>Actual past sales this is based on</h3>");
    h.push('<div class="banner">No sale records attached to this estimate. ' +
           "Treat the value above as a guess, not evidence.</div>");
  }

  // --- how fast the money comes back
  var L = s.liquidity;
  h.push("<h3>How fast it sells</h3>");
  if (L) {
    h.push('<div class="rows">');
    h.push('<div class="row"><span class="k">Speed grade</span><span class="v">' +
           gradePill(L.grade) + "</span></div>");
    h.push('<div class="row"><span class="k">Half sell within</span><span class="v">' +
           days(L.days_p50) + "</span></div>");
    h.push('<div class="row"><span class="k">Most sell within</span><span class="v">' +
           days(L.days_p80) + "</span></div>");
    if (L.sold_90d != null)
      h.push('<div class="row"><span class="k">Sold in last 90 days</span><span class="v">' +
             L.sold_90d + (L.active_now != null ? " · " + L.active_now + " listed now" : "") +
             "</span></div>");
    h.push('<div class="row"><span class="k">Money tied up</span><span class="v">' +
           days(L.capital_days) + "</span></div>");
    h.push("</div>");
  } else {
    h.push('<div style="font-size:14px;color:var(--muted)">Not enough market data to judge speed.</div>');
  }

  // --- the money, with a bid you can change
  var bid = s.next_bid || lot.high_bid || lot.min_bid || 0;
  h.push("<h3>If you win it</h3>");
  h.push('<div class="bidbox"><label class="k" style="font-size:14px">Your bid: </label>' +
         '<input type="number" min="0" step="1" value="' + bid +
         '" data-bid="' + idx + '" aria-label="your bid"> ' +
         '<span class="k" style="font-size:13px">change it to see the numbers move</span></div>');
  h.push('<div data-math="' + idx + '">' + mathBlock(o, bid) + "</div>");

  if ((v.risks || []).length) {
    h.push("<details><summary>What could go wrong (" + v.risks.length + ")</summary>");
    h.push('<ul class="items">');
    v.risks.forEach(function (r) { h.push("<li>" + esc(r) + "</li>"); });
    h.push("</ul></details>");
  }

  return '<div class="card">' + h.join("") + "</div>";
}

// The cost + profit table. Split out so changing the bid re-renders only this.
function mathBlock(o, bid) {
  var cfg = STATE.cfg, L = landed(bid, cfg), h = [];

  h.push('<div class="rows">');
  h.push('<div class="row"><span class="k">Winning bid</span><span class="v">' + money(L.bid) + "</span></div>");
  h.push('<div class="row"><span class="k">Buyer\'s premium (' +
         Math.round((cfg.buyerPremium || 0) * 100) + "%)</span><span class=\"v\">" +
         money(L.premium) + "</span></div>");
  if (cfg.salesTax)
    h.push('<div class="row"><span class="k">Sales tax (' +
           Math.round(cfg.salesTax * 100) + "%)</span><span class=\"v\">" + money(L.tax) + "</span></div>");
  if (cfg.pickupCost)
    h.push('<div class="row"><span class="k">Pickup / freight</span><span class="v">' +
           money(L.pickup) + "</span></div>");
  h.push('<div class="row tot"><span>Total cost to own it</span><span class="v">' +
         money(L.total) + "</span></div>");
  h.push("</div>");

  var pts = (o.listing && o.listing.points) || [];
  if (!pts.length) {
    h.push('<div class="banner">No resale pricing available for this lot yet.</div>');
    return h.join("");
  }

  h.push("<h3>Profit at each selling speed</h3>");
  h.push('<table class="speed"><thead><tr><th>Approach</th><th>List at</th>' +
         "<th>After fees</th><th>Profit</th><th>ROI</th><th>Time</th></tr></thead><tbody>");
  pts.forEach(function (p) {
    var r = atBid(p, bid, cfg);
    var cls = r.profit > 0 ? "p-good" : r.profit < 0 ? "p-bad" : "p-flat";
    h.push("<tr><td>" + esc(LABEL[p.label] || p.label) + "</td>" +
           "<td>" + money(r.price) + "</td>" +
           "<td>" + money(r.net) + "</td>" +
           '<td><span class="pill ' + cls + '">' + money(r.profit) + "</span></td>" +
           "<td>" + pct(r.roi) + "</td>" +
           "<td>" + days(r.expected_days) + "</td></tr>");
  });
  h.push("</tbody></table>");
  h.push('<div class="where" style="margin-top:8px">“After fees” already subtracts the ' +
         "selling platform cut, payment fee, shipping and packaging.</div>");
  return h.join("");
}

function sortRows(rows, how) {
  var best = function (o) {
    var p = (o.listing && o.listing.points) || [];
    return p.reduce(function (m, x) { return Math.max(m, x.profit || 0); }, 0);
  };
  var c = {
    score: function (a, b) { return (b.score.score || 0) - (a.score.score || 0); },
    profit: function (a, b) { return best(b) - best(a); },
    fast: function (a, b) {
      var d = function (o) { return (o.score.liquidity && o.score.liquidity.days_p50) || 1e6; };
      return d(a) - d(b);
    },
    ending: function (a, b) {
      return (a.score.seconds_left == null ? 1e12 : a.score.seconds_left) -
             (b.score.seconds_left == null ? 1e12 : b.score.seconds_left);
    }
  }[how];
  return rows.slice().sort(c);
}

function draw() {
  var how = document.getElementById("sort").value;
  var rows = sortRows(STATE.rows, how);
  var el = document.getElementById("list");

  if (!rows.length) {
    el.innerHTML = '<div class="empty"><p><b>Nothing to show yet.</b></p>' +
      "<p>Either no scan has run, or no lot in the window cleared the bar.</p>" +
      '<p>Press <b>Show sample</b> to see what a result looks like.</p></div>';
    return;
  }
  el.innerHTML = rows.map(card).join("");

  // Wire the bid inputs: recompute that one card's math in place.
  Array.prototype.forEach.call(el.querySelectorAll("input[data-bid]"), function (inp) {
    inp.addEventListener("input", function () {
      var i = Number(inp.getAttribute("data-bid"));
      var o = rows[i];
      var bid = Number(inp.value);
      if (!isFinite(bid) || bid < 0) return;
      var tgt = el.querySelector('[data-math="' + i + '"]');
      if (tgt && o) tgt.innerHTML = mathBlock(o, bid);
    });
  });
}

// ---------------------------------------------------------------- data
var DEFAULT_CFG = { buyerPremium: 0.15, salesTax: 0, pickupCost: 0 };

// The /config route answers in snake_case; everything below speaks camelCase.
// Mapping here rather than renaming fields keeps this page independent of the API's casing.
function readCfg(j) {
  var n = function (x, d) { return typeof x === "number" && isFinite(x) ? x : d; };
  return {
    buyerPremium: n(j && j.buyer_premium, DEFAULT_CFG.buyerPremium),
    salesTax: n(j && j.sales_tax, DEFAULT_CFG.salesTax),
    pickupCost: n(j && j.pickup_cost, DEFAULT_CFG.pickupCost)
  };
}

function loadDemo() {
  STATE.demo = true;
  STATE.cfg = { buyerPremium: 0.15, salesTax: 0.06, pickupCost: 20 };
  STATE.rows = SAMPLE;
  note("<b>Sample data.</b> These three lots are made up, so you can see the layout " +
       "and try the bid box. Nothing here is a real auction.");
  document.getElementById("sub").textContent = "3 sample lots";
  draw();
}

async function load() {
  STATE.demo = false;
  var btn = document.getElementById("load");
  btn.disabled = true;
  btn.textContent = "Loading…";
  note("");
  try {
    var hours = document.getElementById("hours").value;
    var qs = "?include_unvalued=true&limit=60" + (hours ? "&hours=" + hours : "");

    var cfgRes = await fetch("/api/spread/config", { headers: headers() });
    if (cfgRes.status === 401) {
      var pw = prompt("Spread Hunter password:");
      if (pw) { localStorage.setItem(KEY, pw); btn.disabled = false; btn.textContent = "Refresh"; return load(); }
      throw new Error("A password is required.");
    }
    STATE.cfg = cfgRes.ok ? readCfg(await cfgRes.json()) : DEFAULT_CFG;

    var res = await fetch("/api/spread/opportunities" + qs, { headers: headers() });
    if (!res.ok) throw new Error("The server said " + res.status + ".");
    var data = await res.json();
    STATE.rows = (data.opportunities || []).filter(function (o) { return o && o.lot && o.score; });
    document.getElementById("sub").textContent =
      STATE.rows.length + " lot" + (STATE.rows.length === 1 ? "" : "s") +
      " · updated " + new Date().toLocaleTimeString();
    if (!STATE.rows.length)
      note("No lots came back. If you have not run a scan yet, there is nothing stored to show.");
    draw();
  } catch (e) {
    document.getElementById("sub").textContent = "Could not load";
    note("<b>Could not load live data.</b> " + esc(e.message) +
         " You can still press <b>Show sample</b>.", true);
    STATE.rows = [];
    draw();
  } finally {
    btn.disabled = false;
    btn.textContent = "Refresh";
  }
}
