<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spread Hunter</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#15181d; --muted:#5e6672; --line:#e3e6ea;
    --good:#0f7a4d; --goodbg:#e7f6ee; --warn:#8a5a00; --warnbg:#fdf3e0;
    --bad:#a32b2b; --badbg:#fbeaea; --accent:#1f4fd8; --chip:#eef1f5; --photo:#e9ecf0;
    --bar:#cfd8ea; --barstar:#1f4fd8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111317; --card:#191c22; --ink:#e9ecf1; --muted:#9aa3b0; --line:#2b3039;
      --good:#5bd39b; --goodbg:#12301f; --warn:#e0ae4e; --warnbg:#332713;
      --bad:#ef8a8a; --badbg:#3a1c1c; --accent:#7ea2ff; --chip:#21262e; --photo:#232830;
      --bar:#2f3a52; --barstar:#7ea2ff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111317; --card:#191c22; --ink:#e9ecf1; --muted:#9aa3b0; --line:#2b3039;
    --good:#5bd39b; --goodbg:#12301f; --warn:#e0ae4e; --warnbg:#332713;
    --bad:#ef8a8a; --badbg:#3a1c1c; --accent:#7ea2ff; --chip:#21262e; --photo:#232830;
    --bar:#2f3a52; --barstar:#7ea2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:16px}
  header{position:sticky;top:0;background:var(--bg);padding:16px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:21px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  button,select,input{font:inherit;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  button{cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.small{padding:3px 9px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
  .banner{margin:12px 0;padding:11px 13px;border-radius:9px;font-size:14px;
    background:var(--warnbg);color:var(--warn);border:1px solid rgba(138,90,0,.25)}
  .banner.err{background:var(--badbg);color:var(--bad);border-color:rgba(163,43,43,.25)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:0;margin:14px 0;overflow:hidden}
  .body{padding:14px 16px 16px}

  /* the verdict strip: the answer before the evidence */
  .verdict{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .verdict.v-strong_buy,.verdict.v-buy{background:var(--goodbg);color:var(--good)}
  .verdict.v-watch{background:var(--warnbg);color:var(--warn)}
  .verdict.v-pass{background:var(--badbg);color:var(--bad)}
  .verdict.v-none{background:var(--chip);color:var(--muted)}
  .verdict .word{font-weight:800;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
  .verdict .bids{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
  .verdict .bids b{font-size:16px}
  .verdict .bids span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}

  .top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
  .lot{font-weight:600;font-size:17px;line-height:1.35}
  .lot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
  .where{color:var(--muted);font-size:13px;margin-top:3px}
  .score{text-align:center;flex:0 0 auto;min-width:74px}
  .score b{display:block;font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums}
  .score span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .p-good{background:var(--goodbg);color:var(--good)}
  .p-warn{background:var(--warnbg);color:var(--warn)}
  .p-bad{background:var(--badbg);color:var(--bad)}
  .p-flat{background:var(--chip);color:var(--muted)}
  .p-acc{background:var(--accent);color:#fff}

  /* photos */
  .gallery{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:8px;margin-top:12px}
  .hero{position:relative;background:var(--photo);border-radius:10px;overflow:hidden;aspect-ratio:4/3}
  .hero img{width:100%;height:100%;object-fit:contain;display:block;background:var(--photo)}
  .hero .n{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;
    padding:2px 8px;border-radius:999px}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
  .thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;cursor:pointer;
    border:2px solid transparent;background:var(--photo);display:block}
  .thumbs img.on{border-color:var(--accent)}
  .thumbs .more{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:7px;
    background:var(--chip);color:var(--muted);font-size:13px;text-decoration:none}
  .noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:14px}
  .photonote{color:var(--muted);font-size:12px;margin-top:6px}

  .why{margin:12px 0 0;padding:11px 13px;background:var(--chip);border-radius:9px;font-size:14px}
  h3{margin:18px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .rows{display:grid;gap:6px}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;
    padding:5px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted)}
  .row .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .row.tot{font-weight:650;border-top:1px solid var(--line);border-bottom:0;padding-top:8px;margin-top:2px}

  /* what's in it: a bar per item */
  .itemrows{display:grid;gap:7px}
  .item{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
  .item .nm{min-width:0}
  .item .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .track{height:8px;background:var(--chip);border-radius:4px;margin-top:4px;overflow:hidden}
  .item .fill{height:100%;background:var(--bar);border-radius:4px}
  .item.star .fill{background:var(--barstar)}
  .item .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .item .val small{display:block;font-weight:400;color:var(--muted);font-size:11px}
  .item.star .nm b::after{content:" ★";color:var(--accent)}

  /* side by side */
  .sbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .sbs .pane{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .sbs .pane .img{aspect-ratio:1;background:var(--photo);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sbs .pane .img img{width:100%;height:100%;object-fit:contain;display:block}
  .sbs .pane .cap{padding:8px 10px;font-size:13px;line-height:1.4}
  .sbs .pane .cap b{font-size:15px}
  .sbs .pane .cap .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block}
  .sbs .pane .cap a{color:var(--accent);text-decoration:none}
  .sbs .nophoto{padding:14px;text-align:center;color:var(--muted);font-size:13px}

  /* confidence meter */
  .meter{display:flex;align-items:center;gap:10px;font-size:13px}
  .meter .track{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
  .meter .fill{height:100%;border-radius:4px}

  .comp{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:7px 0;
    border-bottom:1px dashed var(--line)}
  .comp:last-child{border-bottom:0}
  .comp .th{width:44px;height:44px;border-radius:6px;background:var(--chip);object-fit:cover;display:block}
  .comp .th.blank{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
  .comp .t{min-width:0}
  .comp .t a{color:var(--accent);text-decoration:none}
  .comp .t a:hover{text-decoration:underline}
  .comp .meta{color:var(--muted);font-size:12px}
  .comp .pr{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .comp .pr small{display:block;font-weight:400}

  table.speed{width:100%;border-collapse:collapse;font-size:14px}
  table.speed th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);padding:0 0 6px}
  table.speed td{padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  table.speed td:not(:first-child),table.speed th:not(:first-child){text-align:right}
  .bidbox{display:flex;gap:8px;align-items:center;margin:10px 0 2px;flex-wrap:wrap}
  .bidbox input{width:110px;font-variant-numeric:tabular-nums}
  .nowline{margin:8px 0 0;font-size:14px;padding:9px 12px;border-radius:9px}
  .items{margin:0;padding-left:19px;font-size:14px}
  .items li{margin:3px 0}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .foot{color:var(--muted);font-size:12px;margin:26px 0 40px;text-align:center}
  .foot a{color:var(--muted)}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px}
  @media (max-width:600px){
    .wrap{padding:12px}
    .top{flex-direction:column-reverse;align-items:stretch}
    .score{text-align:left;display:flex;gap:9px;align-items:baseline}
    .score b{font-size:22px}
    .gallery{grid-template-columns:1fr}
    .thumbs{grid-template-columns:repeat(6,1fr)}
    .sbs{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Spread Hunter</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="sub" id="me"></div>
  <div class="bar">
    <button class="primary" id="load">Refresh</button>
    <select id="sort">
      <option value="verdict">Best buys first</option>
      <option value="score">Highest score first</option>
      <option value="profit">Biggest profit first</option>
      <option value="fast">Fastest to sell first</option>
      <option value="ending">Ending soonest first</option>
    </select>
    <select id="hours">
      <option value="">Any end time</option>
      <option value="6">Ends within 6h</option>
      <option value="24" selected>Ends within 24h</option>
      <option value="72">Ends within 3 days</option>
    </select>
    <label class="chk"><input type="checkbox" id="hidepass"> hide passes</label>
    <button id="demo">Show sample</button>
  </div>
</header>

<div id="msg"></div>
<div id="list"></div>

<div class="foot">
  Every dollar figure is computed from the auction's own fees and real sold prices, not quoted —
  <a href="/spread/index.html">advanced dashboard</a>
</div>

</div>

<script>
"use strict";

// ---------------------------------------------------------------- helpers
var KEY = "spreadKey";
var money = function (n) {
  if (n === null || n === undefined || !isFinite(n)) return "—";
  var neg = n < 0, v = Math.abs(n);
  var s = v >= 100 ? Math.round(v).toLocaleString()
                   : v.toFixed(2).replace(/\.00$/, "");
  return (neg ? "−$" : "$") + s;
};
var pct = function (n) {
  return (n === null || n === undefined || !isFinite(n)) ? "—" : Math.round(n * 100) + "%";
};
var days = function (n) {
  if (n === null || n === undefined || !isFinite(n)) return "—";
  return n < 1 ? "<1 day" : Math.round(n) + (Math.round(n) === 1 ? " day" : " days");
};
var esc = function (s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
};
var countdown = function (sec) {
  if (sec === null || sec === undefined || !isFinite(sec)) return "no end time";
  if (sec <= 0) return "ended";
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h >= 48) return Math.floor(h / 24) + " days left";
  if (h >= 1) return h + "h " + m + "m left";
  return m + "m left";
};
var host = function (u) {
  try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return "link"; }
};
// Only http(s) and data: images are rendered; anything else becomes "no photo".
var safeImg = function (u) {
  return typeof u === "string" && /^(https?:\/\/|data:image\/)/i.test(u) ? u : "";
};
// Where a comp came from, in words a person recognises.
var platform = function (c) {
  var s = (c.source || "").toLowerCase();
  if (s.indexOf("ebay") >= 0) return "eBay";
  if (s.indexOf("heritage") >= 0) return "Heritage";
  if (s.indexOf("worthpoint") >= 0) return "WorthPoint";
  if (s.indexOf("hibid") >= 0) return "HiBid";
  if (s.indexOf("liveauction") >= 0) return "LiveAuctioneers";
  if (s.indexOf("mercari") >= 0) return "Mercari";
  if (c.source) return c.source;
  return c.url ? host(c.url) : "unknown source";
};
var MATCH = {
  exact: ["Exact match", "p-good"], same_model: ["Same model", "p-good"],
  variant: ["Close variant", "p-warn"], category: ["Same category", "p-flat"]
};
var matchPill = function (c) {
  var m = MATCH[c.match];
  if (!m) return "";
  return ' <span class="pill ' + m[1] + '">' + m[0] + "</span>";
};
var MATCH_RANK = { exact: 0, same_model: 1, variant: 2, category: 3 };

// ---------------------------------------------------------------- state
var STATE = { rows: [], demo: false, cfg: null, me: null, positions: {} };

function headers() {
  var k = localStorage.getItem(KEY);
  return k ? { "x-spread-key": k } : {};
}

function note(html, isErr) {
  document.getElementById("msg").innerHTML = html
    ? '<div class="banner' + (isErr ? " err" : "") + '">' + html + "</div>" : "";
}

// ---------------------------------------------------------------- the ledger
// Every "I'm bidding", "won it" and lot-link click is stamped with who did it, so the book page and
// the monthly statement build themselves. Sample mode never writes anything.
var POS = { watching: ["watching", "p-flat"], bidding: ["you're bidding", "p-warn"], likely_won: ["likely won — confirm", "p-acc"],
            won: ["you won", "p-good"], lost: ["passed", "p-flat"], listed: ["listed", "p-warn"], sold: ["sold", "p-good"], kept: ["kept", "p-flat"] };
function posPill(lotId) {
  var p = STATE.positions[lotId]; if (!p) return "";
  var m = POS[p.status] || [p.status, "p-flat"];
  return ' <span class="pill ' + m[1] + '">' + m[0] + (p.bid_intent && p.status === "bidding" ? " " + money(p.bid_intent) : "") + "</span>";
}
async function logEvent(lotId, kind, amount, note) {
  if (STATE.demo) return null;
  var h = headers(); h["content-type"] = "application/json";
  try {
    var res = await fetch("/api/spread/events", { method: "POST", headers: h, keepalive: true,
      body: JSON.stringify({ lot_id: lotId, kind: kind, amount: amount == null ? undefined : amount, note: note || "" }) });
    if (!res.ok) return null;
    var j = await res.json();
    if (j.position) STATE.positions[lotId] = j.position;
    return j.position;
  } catch (e) { return null; }
}
async function loadMe() {
  try {
    var me = await fetch("/api/spread/me", { headers: headers() });
    if (!me.ok) return;
    var j = await me.json();
    STATE.me = j.user;
    var book = await fetch("/api/spread/book", { headers: headers() });
    if (book.ok) { var b = await book.json(); STATE.positions = {}; (b.positions || []).forEach(function (p) { STATE.positions[p.lot_id] = p; });
      var un = (b.unresolved || []).length;
      document.getElementById("me").innerHTML = "Signed in as <b>" + esc(j.user.name) + "</b> · <a href=\"/spread/book.html\" style=\"color:var(--accent)\">my book</a>" +
        (un ? ' · <span class="pill p-warn">' + un + " win" + (un > 1 ? "s" : "") + " to settle</span>" : "");
    }
  } catch (e) { /* the page works without a ledger */ }
}

// ---------------------------------------------------------------- the math
// Landed cost: what leaves your pocket to own the thing.
function landed(bid, cfg) {
  var prem = bid * (cfg.buyerPremium || 0);
  var tax = (bid + prem) * (cfg.salesTax || 0);
  var pickup = cfg.pickupCost || 0;
  return {
    bid: bid, premium: prem, tax: tax, pickup: pickup,
    total: bid + prem + tax + pickup
  };
}

// A price point already carries its own fee math from the server; we only re-base
// the profit when the user tries a different bid.
function atBid(point, bid, cfg) {
  var L = landed(bid, cfg);
  var profit = point.net - L.total;
  return {
    price: point.price, net: point.net, profit: profit,
    roi: L.total > 0 ? profit / L.total : null,
    expected_days: point.expected_days
  };
}

// The server sends a plan; if an older payload lacks one, derive the same numbers here so the
// verdict strip never goes blank. Target = landed at a third of the quick-sale net; stop = half.
function planFor(o, cfg) {
  if (o.plan) return o.plan;
  var pts = (o.listing && o.listing.points) || [];
  var quick = null;
  pts.forEach(function (p) { if (p.label === "quick") quick = p; });
  if (!quick || !(quick.net > 0) || !o.score || !o.score.valued) return null;
  var f = (1 + (cfg.buyerPremium || 0)) * (1 + (cfg.salesTax || 0)), pick = cfg.pickupCost || 0;
  var bidFor = function (L) { return Math.max(0, Math.floor((L - pick) / f)); };
  var walk = bidFor(quick.net / 2), target = Math.min(bidFor(quick.net / 3), walk);
  var now = o.score.landed_cost > 0 ? quick.net / o.score.landed_cost : null;
  var profit = quick.net - (o.score.landed_cost || 0);
  var g = o.score.liquidity && o.score.liquidity.grade;
  var verdict = now === null || now < 1.3 || profit < 10 ? "pass"
    : now < 2 || profit < 25 || g === "D" || g === "F" ? "watch"
    : now < 3 || profit < 40 || g === "C" ? "buy" : "strong_buy";
  return { verdict: verdict, target_bid: target, walk_away_bid: walk, max_all_in: landed(walk, cfg).total,
           quick_net: quick.net, multiple_now: now, basis: "" };
}

// ---------------------------------------------------------------- render
var LABEL = { quick: "Sell fast", market: "Sell at market", patient: "Wait for the right buyer" };
var VERDICT = { strong_buy: "Strong buy", buy: "Buy", watch: "Watch", pass: "Pass" };
var VRANK = { strong_buy: 0, buy: 1, watch: 2, pass: 3 };

function heatPill(h) {
  var cls = h === "hot" ? "p-good" : h === "warm" ? "p-warn" : "p-flat";
  return '<span class="pill ' + cls + '">' + esc(h) + "</span>";
}

function gradePill(g) {
  var cls = (g === "A" || g === "B") ? "p-good" : g === "C" ? "p-warn" : "p-bad";
  return '<span class="pill ' + cls + '">Sells ' + esc(g) + "</span>";
}

function pictures(lot) {
  var out = [];
  (lot.pictures || []).concat([lot.image_full, lot.image]).forEach(function (u) {
    u = safeImg(u);
    if (u && out.indexOf(u) < 0) out.push(u);
  });
  return out;
}

function verdictStrip(o, plan, s) {
  var cls = plan ? "v-" + plan.verdict : "v-none";
  var h = ['<div class="verdict ' + cls + '">'];
  h.push('<div><span class="word">' + (plan ? VERDICT[plan.verdict] : s.valued ? "No plan" : "Not appraised") + "</span>");
  if (s.valued) h.push(' &nbsp;<span class="pill p-flat">score ' + esc(s.score) + "</span> " + heatPill(s.heat || "unvalued"));
  h.push("</div>");
  if (plan) {
    h.push('<div class="bids">');
    h.push("<div><span>Aim for</span><b>" + money(plan.target_bid) + "</b></div>");
    h.push("<div><span>Walk away above</span><b>" + money(plan.walk_away_bid) + "</b></div>");
    h.push("<div><span>Max all-in</span><b>" + money(plan.max_all_in) + "</b></div>");
    h.push("<div><span>Fast sale nets</span><b>" + money(plan.quick_net) + "</b></div>");
    h.push("</div>");
  }
  h.push("</div>");
  return h.join("");
}

function gallery(lot, v, idx) {
  var pics = pictures(lot);
  var h = ['<div class="gallery">'];
  h.push('<div class="hero">');
  if (pics.length) {
    h.push('<a href="' + esc(lot.url || pics[0]) + '" target="_blank" rel="noopener" data-open="' + lot.id + '">' +
           '<img src="' + esc(pics[0]) + '" alt="lot photo" data-hero="' + idx + '" loading="lazy"></a>');
    h.push('<div class="n" data-heron="' + idx + '">1 / ' + pics.length + "</div>");
  } else {
    h.push('<div class="noimg">No photo saved for this lot yet</div>');
  }
  h.push("</div>");
  h.push('<div class="thumbs">');
  pics.slice(0, 11).forEach(function (p, i) {
    h.push('<img src="' + esc(p) + '" alt="" loading="lazy" data-thumb="' + idx + '" data-i="' + i +
           '"' + (i === 0 ? ' class="on"' : "") + ">");
  });
  if (pics.length > 11)
    h.push('<a class="more" href="' + esc(lot.url || "#") + '" target="_blank" rel="noopener">+' + (pics.length - 11) + "</a>");
  h.push("</div></div>");
  var read = v && v.images_used != null ? v.images_used : null;
  var total = Math.max(pics.length, lot.picture_count || 0);
  if (total || read !== null) {
    var txt = total ? total + " photo" + (total === 1 ? "" : "s") + " on the listing" : "";
    if (read !== null) txt += (txt ? " · " : "") + (read ? "the appraiser read " + read + " of them, every mark and label it could" : "appraised from the text only — no photo was read");
    h.push('<div class="photonote">' + esc(txt) + "</div>");
  }
  return h.join("");
}

function itemMid(it) {
  if (it.value_mid != null) return it.value_mid;
  var lo = Number(it.est_low), hi = Number(it.est_high);
  if (isFinite(lo) && isFinite(hi)) return (lo + hi) / 2;
  return isFinite(hi) ? hi : isFinite(lo) ? lo : null;
}

function itemsBlock(v) {
  var h = ["<h3>What's in it</h3>"];
  var its = (v.items || []).filter(function (x) { return x && (x.name || x.item); });
  if (!its.length) {
    h.push('<div style="font-size:14px">' + esc(v.identified_item || "Contents not itemised") +
           (v.unit_count > 1 ? " (" + v.unit_count + " units)" : "") + "</div>");
    return h.join("");
  }
  var max = 0;
  its.forEach(function (it) { var m = itemMid(it); if (m && m > max) max = m; });
  h.push('<div class="itemrows">');
  its.forEach(function (it) {
    var nm = it.name || it.item, m = itemMid(it);
    var star = v.standout_item && (nm === v.standout_item || v.standout_item.indexOf(nm) === 0);
    var sub = [it.maker_or_mark && it.maker_or_mark !== "unmarked" ? it.maker_or_mark : "", it.era, it.condition].filter(Boolean).join(" · ");
    var w = max > 0 && m ? Math.max(2, Math.round((m / max) * 100)) : 0;
    h.push('<div class="item' + (star ? " star" : "") + '"><div class="nm"><b>' + esc(nm) + "</b>" +
           (star ? ' <span class="pill p-acc">the one that matters</span>' : "") +
           (sub ? "<small>" + esc(sub) + "</small>" : "") +
           '<div class="track"><div class="fill" style="width:' + w + '%"></div></div></div>' +
           '<div class="val">' + (m === null ? "—" : m === 0 ? "filler" : "~" + money(m)) +
           (it.resell && it.resell !== "list individually" ? "<small>" + esc(it.resell) + "</small>" : "") + "</div></div>");
  });
  h.push("</div>");
  return h.join("");
}

// The sale that proves the standout piece, or failing that the closest sale with a photo.
function bestComp(v) {
  var comps = (v.comps || []).filter(function (c) { return c && c.price; });
  if (!comps.length) return null;
  var so = v.standout_item || "";
  comps = comps.slice().sort(function (a, b) {
    var fa = so && a.for_item && so.indexOf(a.for_item) >= 0 ? 0 : 1;
    var fb = so && b.for_item && so.indexOf(b.for_item) >= 0 ? 0 : 1;
    if (fa !== fb) return fa - fb;
    var ia = safeImg(a.image) ? 0 : 1, ib = safeImg(b.image) ? 0 : 1;
    if (ia !== ib) return ia - ib;
    return (MATCH_RANK[a.match] == null ? 4 : MATCH_RANK[a.match]) - (MATCH_RANK[b.match] == null ? 4 : MATCH_RANK[b.match]);
  });
  return comps[0];
}

function sideBySide(lot, v) {
  var c = bestComp(v);
  if (!c) return "";
  var pics = pictures(lot);
  var h = ["<h3>Side by side: your lot vs. what actually sold</h3>", '<div class="sbs">'];
  h.push('<div class="pane"><div class="img">' + (pics.length ? '<img src="' + esc(pics[0]) + '" alt="">' : '<div class="nophoto">no lot photo</div>') +
         '</div><div class="cap"><span class="k">In this lot</span><b>' + esc(v.standout_item || v.identified_item || lot.title) + "</b>" +
         "<br>current bid " + money(lot.high_bid || lot.min_bid || 0) + "</div></div>");
  var img = safeImg(c.image);
  var link = c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.title || "sold listing") + "</a>" : esc(c.title || "sold listing");
  h.push('<div class="pane"><div class="img">' + (img ? '<img src="' + esc(img) + '" alt="">' :
         '<div class="nophoto">No listing photo saved —<br>' + (c.url ? 'open the sale ↗' : 'see the sale below') + "</div>") +
         '</div><div class="cap"><span class="k">Sold on ' + esc(platform(c)) + (c.date ? " · " + esc(c.date) : "") +
         "</span><b>" + money(c.price) + "</b>" + matchPill(c) + "<br>" + link + "</div></div>");
  h.push("</div>");
  return h.join("");
}

function confidenceMeter(v) {
  var p = Math.max(0, Math.min(1, Number(v.confidence) || 0));
  var col = p >= 0.7 ? "var(--good)" : p >= 0.45 ? "var(--warn)" : "var(--bad)";
  var word = p >= 0.7 ? "high" : p >= 0.45 ? "medium" : "low";
  return '<div class="meter"><span class="k" style="color:var(--muted)">Confidence</span>' +
         '<div class="track"><div class="fill" style="width:' + Math.round(p * 100) + "%;background:" + col + '"></div></div>' +
         "<b>" + pct(p) + "</b> <span style=\"color:var(--muted)\">" + word + "</span></div>" +
         (v.confidence_reason ? '<div class="where" style="margin-top:4px">' + esc(v.confidence_reason) + "</div>" : "");
}

function card(o, idx) {
  var lot = o.lot || {}, v = o.valuation, s = o.score || {}, cfg = STATE.cfg;
  var plan = v ? planFor(o, cfg) : null;
  var h = [];

  h.push(verdictStrip(o, plan, s));
  h.push('<div class="body">');

  // --- what it is
  var title = lot.url
    ? '<a href="' + esc(lot.url) + '" target="_blank" rel="noopener" data-open="' + lot.id + '">' + esc(lot.title) + "</a>"
    : esc(lot.title);
  h.push('<div class="top">');
  h.push('<div><div class="lot">' + title + posPill(lot.id) + "</div>");
  h.push('<div class="where">' + esc(lot.auction_name || "auction") +
         (lot.city ? " · " + esc(lot.city) + (lot.state ? ", " + esc(lot.state) : "") : "") + " · " +
         countdown(s.seconds_left) + " · current bid <b>" + money(lot.high_bid || lot.min_bid || 0) + "</b>" +
         (lot.bid_count ? " · " + lot.bid_count + " bid" + (lot.bid_count === 1 ? "" : "s") : " · no bids yet") +
         "</div></div>");
  h.push("</div>");

  h.push(gallery(lot, v, idx));

  if (plan && plan.basis) h.push('<div class="why">' + esc(plan.basis) + "</div>");
  else if (o.why) h.push('<div class="why">' + esc(o.why) + "</div>");

  if (!v) {
    h.push('<div class="why">Not appraised yet — no value estimate, so no profit figure. ' +
           "This lot is listed because the title or photos look worth a closer look.</div>");
    h.push("</div>");
    return '<div class="card">' + h.join("") + "</div>";
  }

  // --- what's inside it
  h.push(itemsBlock(v));

  // --- the proof
  h.push(sideBySide(lot, v));

  // --- what it's worth
  h.push("<h3>What it resells for</h3>");
  h.push('<div class="rows">');
  h.push('<div class="row"><span class="k">Our estimate</span><span class="v">' +
         money(v.mid) + " <span class=\"k\">(range " + money(v.low) + "–" + money(v.high) +
         ")</span></span></div>");
  if (v.best_channel)
    h.push('<div class="row"><span class="k">Best place to sell</span><span class="v">' +
           esc(v.best_channel) + "</span></div>");
  h.push("</div>");
  h.push('<div style="margin-top:8px">' + confidenceMeter(v) + "</div>");

  var comps = (v.comps || []).filter(function (c) { return c && c.price; });
  comps.sort(function (a, b) {
    return (MATCH_RANK[a.match] == null ? 4 : MATCH_RANK[a.match]) - (MATCH_RANK[b.match] == null ? 4 : MATCH_RANK[b.match]);
  });
  h.push("<h3>Actual past sales this is based on" + (comps.length ? " (" + comps.length + ")" : "") + "</h3>");
  if (comps.length) {
    comps.slice(0, 8).forEach(function (c) {
      var t = c.url
        ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.title || "sold listing") + "</a>"
        : esc(c.title || "sold listing");
      var img = safeImg(c.image);
      h.push('<div class="comp">' + (img ? '<img class="th" src="' + esc(img) + '" alt="" loading="lazy">' : '<div class="th blank">' + esc(platform(c)).slice(0, 5) + "</div>") +
             '<div class="t">' + t + matchPill(c) +
             '<div class="meta">' + esc(platform(c)) +
             (c.date ? " · " + esc(c.date) : "") +
             (c.for_item ? " · for: " + esc(c.for_item) : "") +
             (c.note ? " · " + esc(c.note) : "") +
             '</div></div><div class="pr">' + money(c.price) + "</div></div>");
    });
  } else {
    h.push('<div class="banner">No sale records attached to this estimate. ' +
           "Treat the value above as a guess, not evidence.</div>");
  }

  // --- how fast the money comes back
  var L = s.liquidity;
  h.push("<h3>How fast it sells</h3>");
  if (L) {
    h.push('<div class="rows">');
    h.push('<div class="row"><span class="k">Speed grade</span><span class="v">' +
           gradePill(L.grade) + "</span></div>");
    h.push('<div class="row"><span class="k">Half sell within</span><span class="v">' +
           days(L.days_p50) + "</span></div>");
    h.push('<div class="row"><span class="k">Most sell within</span><span class="v">' +
           days(L.days_p80) + "</span></div>");
    if (L.sold_90d != null)
      h.push('<div class="row"><span class="k">Sold in last 90 days</span><span class="v">' +
             L.sold_90d + (L.active_now != null ? " · " + L.active_now + " listed now" : "") +
             "</span></div>");
    h.push('<div class="row"><span class="k">Money tied up</span><span class="v">' +
           days(L.capital_days) + "</span></div>");
    h.push("</div>");
  } else {
    h.push('<div style="font-size:14px;color:var(--muted)">Not enough market data to judge speed.</div>');
  }

  // --- the money, with a bid you can change
  var bid = s.next_bid || lot.high_bid || lot.min_bid || 0;
  h.push("<h3>If you win it</h3>");
  h.push('<div class="bidbox"><label class="k" style="font-size:14px">Your bid: </label>' +
         '<input type="number" min="0" step="1" value="' + bid +
         '" data-bid="' + idx + '" aria-label="your bid"> ');
  if (plan) {
    h.push('<button class="small" data-setbid="' + idx + '" data-val="' + plan.target_bid + '">target ' + money(plan.target_bid) + "</button>");
    h.push('<button class="small" data-setbid="' + idx + '" data-val="' + plan.walk_away_bid + '">walk-away ' + money(plan.walk_away_bid) + "</button>");
  }
  h.push('<span class="k" style="font-size:13px;color:var(--muted)">change it to see the numbers move</span></div>');
  if (!STATE.demo) {
    var p = STATE.positions[lot.id], st = p ? p.status : "";
    h.push('<div class="bidbox" data-ledger="' + lot.id + '">');
    if (st === "won" || st === "sold" || st === "kept" || st === "listed") h.push('<span class="k" style="font-size:13px;color:var(--muted)">In your book — <a href="/spread/book.html" style="color:var(--accent)">record the sale</a></span>');
    else {
      h.push('<button class="small" data-led="bid_intent" data-lot="' + lot.id + '" data-idx="' + idx + '">I\u2019m bidding this</button>');
      h.push('<button class="small" data-led="won" data-lot="' + lot.id + '" data-idx="' + idx + '">Won it</button>');
      h.push('<button class="small" data-led="skip" data-lot="' + lot.id + '">Pass</button>');
    }
    h.push("</div>");
  }
  h.push('<div data-math="' + idx + '">' + mathBlock(o, bid, plan) + "</div>");

  if ((v.risks || []).length) {
    h.push("<details><summary>What could go wrong (" + v.risks.length + ")</summary>");
    h.push('<ul class="items">');
    v.risks.forEach(function (r) { h.push("<li>" + esc(r) + "</li>"); });
    h.push("</ul></details>");
  }
  if ((v.value_drivers || []).length) {
    h.push("<details><summary>Why it is worth that (" + v.value_drivers.length + ")</summary>");
    h.push('<ul class="items">');
    v.value_drivers.forEach(function (r) { h.push("<li>" + esc(r) + "</li>"); });
    h.push("</ul></details>");
  }

  h.push("</div>");
  return '<div class="card">' + h.join("") + "</div>";
}

// The cost + profit table. Split out so changing the bid re-renders only this.
function mathBlock(o, bid, plan) {
  var cfg = STATE.cfg, L = landed(bid, cfg), h = [];

  if (plan && plan.quick_net > 0) {
    var m = L.total > 0 ? plan.quick_net / L.total : null;
    var p = plan.quick_net - L.total;
    var cls = bid > plan.walk_away_bid ? "p-bad" : bid > plan.target_bid ? "p-warn" : "p-good";
    var bg = cls === "p-bad" ? "var(--badbg)" : cls === "p-warn" ? "var(--warnbg)" : "var(--goodbg)";
    var fg = cls === "p-bad" ? "var(--bad)" : cls === "p-warn" ? "var(--warn)" : "var(--good)";
    h.push('<div class="nowline" style="background:' + bg + ";color:" + fg + '">At <b>' + money(bid) + "</b> you are in for <b>" + money(L.total) +
           "</b> all-in. A fast sale nets " + money(plan.quick_net) + " — " +
           (m === null ? "" : "<b>" + m.toFixed(1) + "x</b> your money, ") + "<b>" + money(p) + "</b> clear" +
           (bid > plan.walk_away_bid ? ". <b>Past the walk-away point.</b>" : bid > plan.target_bid ? ". Above target, still inside the line." : ". Inside the target.") + "</div>");
  }

  h.push('<div class="rows" style="margin-top:10px">');
  h.push('<div class="row"><span class="k">Winning bid</span><span class="v">' + money(L.bid) + "</span></div>");
  h.push('<div class="row"><span class="k">Buyer\'s premium (' +
         Math.round((cfg.buyerPremium || 0) * 100) + "%)</span><span class=\"v\">" +
         money(L.premium) + "</span></div>");
  if (cfg.salesTax)
    h.push('<div class="row"><span class="k">Sales tax (' +
           Math.round(cfg.salesTax * 100) + "%)</span><span class=\"v\">" + money(L.tax) + "</span></div>");
  if (cfg.pickupCost)
    h.push('<div class="row"><span class="k">Pickup / freight</span><span class="v">' +
           money(L.pickup) + "</span></div>");
  h.push('<div class="row tot"><span>Total cost to own it</span><span class="v">' +
         money(L.total) + "</span></div>");
  h.push("</div>");

  var pts = (o.listing && o.listing.points) || [];
  if (!pts.length) {
    h.push('<div class="banner">No resale pricing available for this lot yet.</div>');
    return h.join("");
  }

  h.push("<h3>Profit at each selling speed</h3>");
  h.push('<table class="speed"><thead><tr><th>Approach</th><th>List at</th>' +
         "<th>After fees</th><th>Profit</th><th>ROI</th><th>Time</th></tr></thead><tbody>");
  pts.forEach(function (p) {
    var r = atBid(p, bid, cfg);
    var cls = r.profit > 0 ? "p-good" : r.profit < 0 ? "p-bad" : "p-flat";
    h.push("<tr><td>" + esc(LABEL[p.label] || p.label) + "</td>" +
           "<td>" + money(r.price) + "</td>" +
           "<td>" + money(r.net) + "</td>" +
           '<td><span class="pill ' + cls + '">' + money(r.profit) + "</span></td>" +
           "<td>" + pct(r.roi) + "</td>" +
           "<td>" + days(r.expected_days) + "</td></tr>");
  });
  h.push("</tbody></table>");
  h.push('<div class="where" style="margin-top:8px">“After fees” already subtracts the ' +
         "selling platform cut, payment fee, shipping and packaging.</div>");
  return h.join("");
}

function sortRows(rows, how) {
  var best = function (o) {
    var p = (o.listing && o.listing.points) || [];
    return p.reduce(function (m, x) { return Math.max(m, x.profit || 0); }, 0);
  };
  var vr = function (o) { var p = o.valuation ? planFor(o, STATE.cfg) : null; return p ? VRANK[p.verdict] : 4; };
  var c = {
    verdict: function (a, b) { return (vr(a) - vr(b)) || ((b.score.score || 0) - (a.score.score || 0)); },
    score: function (a, b) { return (b.score.score || 0) - (a.score.score || 0); },
    profit: function (a, b) { return best(b) - best(a); },
    fast: function (a, b) {
      var d = function (o) { return (o.score.liquidity && o.score.liquidity.days_p50) || 1e6; };
      return d(a) - d(b);
    },
    ending: function (a, b) {
      return (a.score.seconds_left == null ? 1e12 : a.score.seconds_left) -
             (b.score.seconds_left == null ? 1e12 : b.score.seconds_left);
    }
  }[how];
  return rows.slice().sort(c);
}

function draw() {
  var how = document.getElementById("sort").value;
  var rows = sortRows(STATE.rows, how);
  if (document.getElementById("hidepass").checked)
    rows = rows.filter(function (o) { var p = o.valuation ? planFor(o, STATE.cfg) : null; return !p || p.verdict !== "pass"; });
  var el = document.getElementById("list");

  if (!rows.length) {
    el.innerHTML = '<div class="empty"><p><b>Nothing to show yet.</b></p>' +
      "<p>Either no scan has run, or no lot in the window cleared the bar.</p>" +
      '<p>Press <b>Show sample</b> to see what a result looks like.</p></div>';
    return;
  }
  el.innerHTML = rows.map(card).join("");

  // Wire the bid inputs: recompute that one card's math in place.
  var recompute = function (i, bid) {
    var o = rows[i];
    if (!isFinite(bid) || bid < 0 || !o) return;
    var tgt = el.querySelector('[data-math="' + i + '"]');
    if (tgt) tgt.innerHTML = mathBlock(o, bid, o.valuation ? planFor(o, STATE.cfg) : null);
  };
  Array.prototype.forEach.call(el.querySelectorAll("input[data-bid]"), function (inp) {
    inp.addEventListener("input", function () {
      recompute(Number(inp.getAttribute("data-bid")), Number(inp.value));
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll("button[data-setbid]"), function (btn) {
    btn.addEventListener("click", function () {
      var i = btn.getAttribute("data-setbid"), v = Number(btn.getAttribute("data-val"));
      var inp = el.querySelector('input[data-bid="' + i + '"]');
      if (inp) { inp.value = v; recompute(Number(i), v); }
    });
  });
  // The ledger: bidding / won / pass, and which lots were actually opened.
  Array.prototype.forEach.call(el.querySelectorAll("button[data-led]"), function (btn) {
    btn.addEventListener("click", async function () {
      var lotId = Number(btn.getAttribute("data-lot")), kind = btn.getAttribute("data-led"), amount = null;
      var inp = el.querySelector('input[data-bid="' + btn.getAttribute("data-idx") + '"]');
      if (kind === "bid_intent") { amount = inp ? Number(inp.value) : null; if (!amount) { alert("Enter the bid you plan to place first."); return; } }
      if (kind === "won") { var w = prompt("What did it hammer for (your winning bid, before premium)?", inp ? inp.value : ""); if (w === null) return; amount = Number(w) || 0; }
      btn.disabled = true;
      var p = await logEvent(lotId, kind, amount, "");
      var box = el.querySelector('[data-ledger="' + lotId + '"]');
      if (!p) { btn.disabled = false; if (box) box.insertAdjacentHTML("beforeend", '<span class="pill p-bad">could not save</span>'); return; }
      if (box) box.innerHTML = '<span class="pill ' + (POS[p.status] || ["", "p-flat"])[1] + '">' + (POS[p.status] || [p.status])[0] + "</span> " +
        (p.status === "won" ? '<a href="/spread/book.html" style="color:var(--accent);font-size:13px">it\u2019s in your book</a>' : '<button class="small" data-led="won" data-lot="' + lotId + '" data-idx="' + btn.getAttribute("data-idx") + '">Won it</button>');
      var again = box && box.querySelector("button[data-led]");
      if (again) again.addEventListener("click", function () { btn.getAttribute && (async function () { var w2 = prompt("What did it hammer for?"); if (w2 === null) return; var p2 = await logEvent(lotId, "won", Number(w2) || 0, ""); if (p2) box.innerHTML = '<span class="pill p-good">you won</span> <a href="/spread/book.html" style="color:var(--accent);font-size:13px">it\u2019s in your book</a>'; })(); });
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll("a[data-open]"), function (a) {
    a.addEventListener("click", function () { logEvent(Number(a.getAttribute("data-open")), "view", null, ""); });
  });
  // Thumbnails swap the hero photo.
  Array.prototype.forEach.call(el.querySelectorAll("img[data-thumb]"), function (th) {
    th.addEventListener("click", function () {
      var i = th.getAttribute("data-thumb");
      var hero = el.querySelector('img[data-hero="' + i + '"]');
      var n = el.querySelector('[data-heron="' + i + '"]');
      if (hero) hero.src = th.src;
      if (n) n.textContent = (Number(th.getAttribute("data-i")) + 1) + " / " + n.textContent.split("/")[1].trim();
      Array.prototype.forEach.call(el.querySelectorAll('img[data-thumb="' + i + '"]'), function (x) { x.classList.remove("on"); });
      th.classList.add("on");
    });
  });
}

// ---------------------------------------------------------------- data
var DEFAULT_CFG = { buyerPremium: 0.15, salesTax: 0, pickupCost: 0 };

// The /config route answers in snake_case; everything below speaks camelCase.
// Mapping here rather than renaming fields keeps this page independent of the API's casing.
function readCfg(j) {
  var n = function (x, d) { return typeof x === "number" && isFinite(x) ? x : d; };
  return {
    buyerPremium: n(j && j.buyer_premium, DEFAULT_CFG.buyerPremium),
    salesTax: n(j && j.sales_tax, DEFAULT_CFG.salesTax),
    pickupCost: n(j && j.pickup_cost, DEFAULT_CFG.pickupCost)
  };
}

function loadDemo() {
  STATE.demo = true;
  document.getElementById("me").innerHTML = "";
  STATE.cfg = { buyerPremium: 0.15, salesTax: 0.06, pickupCost: 20 };
  STATE.rows = SAMPLE;
  note("<b>Sample data.</b> These three lots are made up, so you can see the layout " +
       "and try the bid box. Nothing here is a real auction and the photos are placeholders.");
  document.getElementById("sub").textContent = "3 sample lots";
  draw();
}

async function load() {
  STATE.demo = false;
  var btn = document.getElementById("load");
  btn.disabled = true;
  btn.textContent = "Loading…";
  note("");
  try {
    var hours = document.getElementById("hours").value;
    var qs = "?include_unvalued=true&limit=60" + (hours ? "&hours=" + hours : "");

    var cfgRes = await fetch("/api/spread/config", { headers: headers() });
    if (cfgRes.status === 401) {
      var pw = prompt("Your Spread Hunter access key:");
      if (pw) { localStorage.setItem(KEY, pw); btn.disabled = false; btn.textContent = "Refresh"; return load(); }
      throw new Error("A password is required.");
    }
    STATE.cfg = cfgRes.ok ? readCfg(await cfgRes.json()) : DEFAULT_CFG;

    var res = await fetch("/api/spread/opportunities" + qs, { headers: headers() });
    if (!res.ok) throw new Error("The server said " + res.status + ".");
    var data = await res.json();
    STATE.rows = (data.opportunities || []).filter(function (o) { return o && o.lot && o.score; });
    await loadMe();
    document.getElementById("sub").textContent =
      STATE.rows.length + " lot" + (STATE.rows.length === 1 ? "" : "s") +
      " · updated " + new Date().toLocaleTimeString();
    if (!STATE.rows.length)
      note("No lots came back. If you have not run a scan yet, there is nothing stored to show.");
    draw();
  } catch (e) {
    document.getElementById("sub").textContent = "Could not load";
    note("<b>Could not load live data.</b> " + esc(e.message) +
         " You can still press <b>Show sample</b>.", true);
    STATE.rows = [];
    draw();
  } finally {
    btn.disabled = false;
    btn.textContent = "Refresh";
  }
}
